<svg viewBox="0 0 220 80" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Icon - positioned on a grid at the left -->
  <g transform="translate(5, 15)">
    <!-- Outer Circle - with thicker stroke -->
    <circle cx="30" cy="30" r="28" stroke="#F7F2E8" stroke-width="2.5" fill="none"/>

    <!-- Orange Circle (Bottom) -->
    <circle cx="22" cy="35" r="12" fill="#FF1E2D"/>

    <!-- Middle Circle - black with white outline -->
    <circle cx="30" cy="22" r="11" fill="#0D0D0F"/>

    <!-- White Circle -->
    <circle cx="37" cy="35" r="7" fill="#F7F2E8"/>

    <!-- All the outlines - thicker at 2.5px -->
    <circle cx="22" cy="35" r="12" stroke="#F7F2E8" stroke-width="2.5" fill="none"/>
    <circle cx="30" cy="22" r="11" stroke="#F7F2E8" stroke-width="2.5" fill="none"/>
    <circle cx="37" cy="35" r="7" stroke="#F7F2E8" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Text - "BioKit Labs" with Space Grotesk font -->
  <g transform="translate(75, 10)">
    <!-- BioKit -->
    <text x="0" y="32" font-family="'Space Grotesk', sans-serif" font-size="35" font-weight="700" letter-spacing="-0.03em" fill="#F7F2E8">
      <tspan>B</tspan>
      <tspan>i</tspan>
      <tspan fill="#FF1E2D">o</tspan>
      <tspan>K</tspan>
      <tspan>i</tspan>
      <tspan>t</tspan>
    </text>

    <!-- Labs -->
    <text x="0" y="65" font-family="'Space Grotesk', sans-serif" font-size="35" font-weight="700" letter-spacing="-0.03em" fill="#F7F2E8">
      <tspan>L</tspan>
      <tspan>a</tspan>
      <tspan>b</tspan>
      <tspan>s</tspan>
    </text>
  </g>
</svg>